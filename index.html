    <script>
      // Single Page Apps for GitHub Pages or static web hosts path restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          var getter = function() { return _fetch; };
          var setter = function(v) { _fetch = v; };

          var targets = [window];
          if (typeof window.Window === 'function' && window.Window.prototype) {
            targets.push(window.Window.prototype);
          }

          targets.forEach(function(target) {
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable !== false) {
                Object.defineProperty(target, 'fetch', {
                  get: getter,
                  set: setter,
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          });
        } catch (e) {}
      })();
    </script>
